# Nginx (Hostinger/VPS) - SORED (Next.js + Backend Express)
#
# Opção recomendada após a refatoração:
# - Todo o tráfego público vai para o Next.js (porta 3000)
# - O Next chama o backend Express internamente em `BACKEND_URL=http://127.0.0.1:3001`
#
# Assim:
# - `FRONTEND_URL=https://app.seudominio.com`
# - `BASE_URL=https://app.seudominio.com`  (webhook do Mercado Pago → /api/webhooks/mercadopago)
# - `BACKEND_URL=http://127.0.0.1:3001`

upstream sored_frontend {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream sored_backend {
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 80;
    server_name app.seudominio.com www.app.seudominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.seudominio.com www.app.seudominio.com;

    # SSL (ajuste para seus paths/certificados)
    ssl_certificate /home/u123456789/ssl/app.seudominio.com.crt;
    ssl_certificate_key /home/u123456789/ssl/app.seudominio.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers de segurança
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Log (ajuste paths)
    access_log /home/u123456789/domains/app.seudominio.com/logs/access.log;
    error_log /home/u123456789/domains/app.seudominio.com/logs/error.log;

    client_max_body_size 10M;

    # Frontend (Next.js)
    location / {
        proxy_pass http://sored_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check (nginx)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Bloquear arquivos sensíveis
    location ~ /\. {
        deny all;
    }

    location ~ ~$ {
        deny all;
    }
}

