apiVersion: apps/v1
kind: Deployment
metadata:
  name: sored-backend
  labels:
    app: sored-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sored-backend
  template:
    metadata:
      labels:
        app: sored-backend
    spec:
      containers:
      - name: sored-backend
        image: sored-backend:latest
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: sored-secrets
              key: mongodb-uri
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: sored-secrets
              key: jwt-secret
        - name: BASE_URL
          valueFrom:
            secretKeyRef:
              name: sored-secrets
              key: base-url
        - name: ALLOWED_ORIGINS
          valueFrom:
            secretKeyRef:
              name: sored-secrets
              key: allowed-origins
        - name: MERCADO_PAGO_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: sored-secrets
              key: mercado-pago-access-token
        - name: MERCADO_PAGO_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: sored-secrets
              key: mercado-pago-public-key
        - name: MERCADO_PAGO_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: sored-secrets
              key: mercado-pago-webhook-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: sored-backend-service
spec:
  selector:
    app: sored-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3001
  type: LoadBalancer

---
apiVersion: v1
kind: Secret
metadata:
  name: sored-secrets
type: Opaque
data:
  # Base64 encoded values - use: echo -n 'your-value' | base64
  mongodb-uri: <base64-encoded-mongodb-uri>
  jwt-secret: <base64-encoded-jwt-secret>
  base-url: <base64-encoded-base-url>
  allowed-origins: <base64-encoded-allowed-origins>
  mercado-pago-access-token: <base64-encoded-mercado-pago-token>
  mercado-pago-public-key: <base64-encoded-mercado-pago-public-key>
  mercado-pago-webhook-secret: <base64-encoded-webhook-secret>
